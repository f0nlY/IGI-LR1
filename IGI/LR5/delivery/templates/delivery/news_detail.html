{% extends 'delivery/base.html' %}
{% block title %}{{ article.title }}{% endblock %}
{% block content %}
<div class="card">
    {% if article.image %}
        <img src="{{ article.image.url }}" alt="{{ article.title }}"
             style="width:100%; max-height:300px; object-fit:cover; border-radius:6px; margin-bottom:15px;">
    {% endif %}
    <h2>{{ article.title }}</h2>
    <p style="color:#888; font-size:0.85em; margin-bottom:15px;">
        Опубликовано: {{ article.pub_date|date:"d/m/Y H:i" }}
    </p>
    <div style="line-height:1.7;">{{ article.content|linebreaks }}</div>
</div>
<a href="/news/" class="btn btn-gray">← Все новости</a>
{% endblock %}
