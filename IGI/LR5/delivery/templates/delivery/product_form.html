{% extends 'delivery/base.html' %}
{% block title %}{{ action }} товар{% endblock %}
{% block content %}
<div class="card" style="max-width: 600px; margin: auto;">
    <h2>{{ action }} товар</h2>
    <br>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
            <div style="margin-bottom: 15px;">
                <label style="display:block; font-weight:bold; margin-bottom:4px;">
                    {{ field.label }}
                </label>
                {{ field }}
                {% if field.errors %}
                    <p style="color:red; font-size:0.85em;">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-green">{{ action }}</button>
        <a href="/" class="btn btn-gray">Отмена</a>
    </form>
</div>
{% endblock %}
